name: Deploy Web Playtest to Pages

on:
  push:
    branches: [main]
    paths:
      - 'build/web/**'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/verify_pages_artifact.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate the existing exported build
        run: python3 scripts/verify_pages_artifact.py build/web
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload unchanged static game files
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
