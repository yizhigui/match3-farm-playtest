<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9e5c4">
  <title>暖心農場 原型對齊版 · Web Playtest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d9e5c4; }
    body { font: 14px system-ui, sans-serif; color: #293c28; overscroll-behavior: none; }
    #safe-area {
      position: fixed; inset: 0;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      display: flex; align-items: center; justify-content: center;
    }
    #available { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #game { position: relative; width: 360px; height: 640px; flex: none; }
    #canvas { display: block; width: 100%; height: 100%; border: 0; outline: none;
              image-rendering: pixelated; touch-action: none; -webkit-user-select: none; user-select: none; }
    #status { position: absolute; inset: 0; background: #d9e5c4; display: flex;
              align-items: center; justify-content: center; flex-direction: column; padding: 20px; text-align: center; }
    #status[hidden] { display: none; }
    #notice { white-space: pre-line; }
    progress { width: 80%; max-width: 280px; }
  </style>
  
</head>
<body>
  <div id="safe-area"><div id="available"><div id="game">
    <canvas id="canvas" width="360" height="640" tabindex="0" aria-label="暖心農場遊戲"></canvas>
    <div id="status" role="status"><p id="notice">正在載入暖心農場…</p><progress id="progress"></progress></div>
  </div></div></div>
  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11478448,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const GODOT_THREADS_ENABLED = false;
    const canvas = document.getElementById('canvas');
    const game = document.getElementById('game');
    const available = document.getElementById('available');
    const status = document.getElementById('status');
    const notice = document.getElementById('notice');
    const progress = document.getElementById('progress');
    // The pinned, single-threaded template can present directly when returning
    // to the browser event loop. Its emulated offscreen swap triggers a WebKit
    // framebuffer feedback error. Keep this change scoped to this game canvas,
    // preserve the actual WebGL attributes, and never enable it for threads.
    // Revalidate this integration whenever updating Godot/Emscripten templates.
    const nativeGetContext = canvas.getContext.bind(canvas);
    canvas.getContext = (type, attributes) => {
      if (!GODOT_THREADS_ENABLED && type === 'webgl2' && attributes &&
          'renderViaOffscreenBackBuffer' in attributes) {
        attributes.renderViaOffscreenBackBuffer = false;
        attributes.explicitSwapControl = false;
      }
      return nativeGetContext(type, attributes);
    };
    // Render at the original logical resolution. CSS uses nearest sampling and
    // one uniform scale; it never stretches the farm artwork to the browser ratio.
    function fitGame() {
      const bounds = available.getBoundingClientRect();
      const scale = Math.min(bounds.width / 360, bounds.height / 640);
      game.style.width = `${360 * scale}px`;
      game.style.height = `${640 * scale}px`;
    }
    fitGame();
    new ResizeObserver(fitGame).observe(available);
    // Dynamic toolbar heights and rotation must both recompute the safe region.
    if (window.visualViewport) {
      const fitViewport = () => {
        document.getElementById('safe-area').style.height = `${window.visualViewport.height}px`;
        fitGame();
      };
      window.visualViewport.addEventListener('resize', fitViewport);
      fitViewport();
    }
    function fail(error) {
      console.error(error);
      status.hidden = false;
      progress.hidden = true;
      notice.textContent = '遊戲未能載入。請使用新版瀏覽器，重新整理後再試。\n' + String(error.message || error);
    }
    function prepareAudio() {
      const Native = window.AudioContext || window.webkitAudioContext;
      if (typeof Native !== 'function') return;
      try {
        // Validate initialization once, then give this same context to Godot.
        // Autoplay may leave it suspended; the first DOM gesture resumes it.
        let first = new Native();
        const guarded = new Proxy(Native, {construct(Target, args) {
          if (first) { const context = first; first = null; return context; }
          return Reflect.construct(Target, args);
        }});
        window.AudioContext = guarded;
        if (window.webkitAudioContext) window.webkitAudioContext = guarded;
      } catch (error) {
        // Godot detects the absent WebAudio API and uses its silent driver.
        // An unavailable sound device must not prevent a playable game.
        window.AudioContext = undefined;
        window.webkitAudioContext = undefined;
        console.warn('WebAudio unavailable; continuing without sound.', error);
      }
    }
    if (location.protocol === 'file:') {
      fail('請從提供的 HTTPS 試玩網址開啟遊戲。');
    } else {
      const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
      if (missing.length) {
        fail('缺少瀏覽器功能：' + missing.join(', '));
      } else {
        prepareAudio();
        const engine = new Engine({...GODOT_CONFIG, canvas, persistentPaths: ['/userfs']});
        // Godot resumes its own AudioContext from trusted canvas touch/click/key
        // events. SfxManager suppresses all sounds before the first interaction.
        engine.startGame({
          onProgress: (current, total) => {
            if (total > 0) { progress.max = total; progress.value = current; }
          },
          onExit: () => { status.hidden = false; progress.hidden = true; notice.textContent = '遊戲已結束，可以重新整理再次進入。'; }
        }).then(() => { status.hidden = true; }).catch(fail);
      }
    }
  </script>
</body>
</html>
